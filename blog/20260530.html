        でも、なんか、HPつくりてぇな〜〜〜〜〜〜〜〜〜〜〜〜<br>
        ...て思ったの。<br>
        だからこうしてる。
        <button onclick="g()">以上。</button>
        `
      }
      function g(){
        I = document.getElement.ById("id")
        I.innerHTML = ""
      }
    </script>
